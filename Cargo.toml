[package]
name = "g-codifier"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/FraI3mega/g-codifier"

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
color-eyre = "0.6.5"
lzma-rust2 = "0.26.0"
regex = "1.13.2"

[lints.clippy]
pedantic = { level = "deny", priority = -1 } # UM, ACTUALLY
nursery = { level = "deny", priority = -1 }  # BETA LINTS

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
